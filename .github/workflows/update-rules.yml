name: Update AI rules

on:
  schedule:
    # GitHub cron uses UTC: 20:00 UTC = next day 04:00 Asia/Shanghai.
    # Scheduled runs may be delayed by GitHub; this is not a real-time timer.
    - cron: '0 20 * * *'
  workflow_dispatch:

# Only this trusted default-branch workflow can publish generated files.
permissions:
  contents: write

concurrency:
  group: update-ai-rules
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        # Pin action versions to commit IDs to avoid moving-tag dependencies.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch and generate rules
        run: python scripts/update_rules.py
      - name: Commit changed rules
        # Only generated outputs are staged. A failed download or parser never
        # reaches this step, so the last published subscription remains available.
        run: |
          git add -- Rules/AI/AI.list sources.lock.json
          if git diff --cached --quiet; then
            echo "Sources checked; no changes." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update AI model rules'
          # No force push: a concurrent human push must cause a safe failure.
          git push origin HEAD:main
          echo "Updated Rules/AI/AI.list and source provenance." >> "$GITHUB_STEP_SUMMARY"
